name: Check pull request

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm install
      - run: npm run lint
      - run: npm test
      - uses: actions/cache@v4
        with:
          path: public/whenet
          key: whenet-${{ hashFiles('scripts/prepare-whenet.mjs', 'package-lock.json') }}
      - run: npm run build
