        <h1>3D Pose Audio Radar - 360° HRTF Spatial Audio</h1>
        <p>
          360°立体音響空間レーダー。MediaPipe Pose 3D骨格 ＆ WHENet頭部姿勢推定 × Web Audio HRTF により、音だけでカメラ位置を知覚するWebアプリケーションです。
        </p>
        <h2>主な特徴 (Key Features)</h2>
        <ul>
          <li><strong>360° HRTF 立体音響:</strong> Web Audio API の PannerNode (HRTF モデル) を用いて、頭部の向きに応じたリアルな3次元バイノーラル音響を生成。</li>
          <li><strong>MediaPipe Pose 3D 骨格追跡:</strong> カメラ映像からリアルタイムで首や顔、体の3次元ランドマークを検出。</li>
          <li><strong>WHENet 頭部姿勢推定:</strong> ONNX Runtime Web を使用したディープニューラルネットワークによる高精度なヨー・ピッチ・ロール角推定。</li>
          <li><strong>リアルタイム空間レーダー表示:</strong> 頭部中心の相対座標系でカメラの位置・仰角・距離をグラフィカルに可視化。</li>
          <li><strong>PWA (Progressive Web App) 対応:</strong> スマートフォンやPCにインストールしてネイティブアプリ感覚で起動可能。</li>
        </ul>
        <h2>よくある質問 (FAQ)</h2>
        <dl>
          <dt><strong>Q. 利用に特別な機器が必要ですか？</strong></dt>
          <dd>一般的なWebカメラ付きデバイスと市販のステレオヘッドホン・イヤホンのみで動作します。</dd>
          <dt><strong>Q. カメラ映像はサーバーに送信されますか？</strong></dt>
          <dd>送信されません。すべての画像解析と音声合成処理はブラウザ内で完結するため安全です。</dd>
        </dl>
        <h2>推奨環境</h2>
        <p>カメラおよびヘッドホン・イヤホンの装着が推奨されます。本アプリを利用するにはJavaScriptを有効にしてください。</p>
